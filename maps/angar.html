/* ============================================================================
   НАРУЖНЫЕ ВХОДЫ НА 2 ЭТАЖ
   Лестница с улицы (из ангара) к двери второго этажа: площадка у проёма,
   марш вдоль фасада и перила. Марш идёт вдоль стены, а не от неё —
   иначе он перекрывает проезд и заезд в гараж.
============================================================================ */
/** Стальная площадка на опорах: настил из рифлёного листа + обвязка. */
function platform(x0,z0,x1,z1,y, opt={}){
  const sx=x1-x0, sz=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  addBox('steel', cx, y-0.045, cz, sx, 0.09, sz, {d:.7});
  // обвязка по периметру
  addBox('steel', cx, y-0.18, z0+0.06, sx, 0.22, 0.12, {collide:false, d:1});
  addBox('steel', cx, y-0.18, z1-0.06, sx, 0.22, 0.12, {collide:false, d:1});
  addBox('steel', x0+0.06, y-0.18, cz, 0.12, 0.22, sz, {collide:false, d:1});
  addBox('steel', x1-0.06, y-0.18, cz, 0.12, 0.22, sz, {collide:false, d:1});
  if(opt.posts !== false){
    for(const px of [x0+0.16, x1-0.16]) for(const pz of [z0+0.16, z1-0.16]){
      addBox('steel', px, (y-0.29)/2, pz, 0.12, y-0.29, 0.12, {d:1.1});
      // косынка-раскос к стойке
      const g = new THREE.BoxGeometry(0.06, 0.9, 0.06);
      g.rotateX(0.7); g.translate(px, y*0.42, pz + (pz<cz?0.3:-0.3));
      bucket('steel').push(g);
    }
  }
}
/** Стальной марш: ступени из просечного листа на косоурах. */
function steelStairs(x0,z0, dir, y0,y1, width=1.3, run=4.6){
  const steps = Math.max(8, Math.round((y1-y0)/0.185));
  const rise = (y1-y0)/steps, tread = run/steps;
  const long = dir==='+x' || dir==='-x';
  const sgn = (dir==='+x'||dir==='+z') ? 1 : -1;
  for(let i=0;i<steps;i++){
    const t = tread*(i+0.5);
    const cx = long ? x0 + sgn*t : x0;
    const cz = long ? z0 : z0 + sgn*t;
    const sx = long ? tread : width, sz = long ? width : tread;
    addBox('steel', cx, y0+rise*(i+1)-0.03, cz, sx, 0.06, sz, {d:1.4});
    // подступенок открытый — только уголок под ступенью
    addBox('steel', cx - (long?sgn*tread/2:0), y0+rise*(i+0.5)-0.09,
           cz - (long?0:sgn*tread/2), long?0.04:sx, rise*0.5, long?sz:0.04,
           {collide:false, d:1.2});
  }
  // косоуры и перила
  for(const s of [-1,1]){
    const ox = long ? 0 : s*width/2, oz = long ? s*width/2 : 0;
    const mx = long ? x0 + sgn*run/2 : x0 + ox;
    const mz = long ? z0 + oz : z0 + sgn*run/2;
    const dl = Math.hypot(run, y1-y0);
    const g = new THREE.BoxGeometry(long?dl:0.09, 0.26, long?0.09:dl);
    uvBox(g, long?dl:0.09, 0.26, long?0.09:dl, 1.1);
    // Косоур поднимается в сторону марша. Знак угла подобран так, чтобы
    // дальний по ходу конец был выше: при развороте (sgn<0) уклон меняется.
    const slope = Math.atan2(y1-y0, run);
    _e.set(long ? 0 : -slope*sgn, 0, long ? slope*sgn : 0);
    _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3(mx, (y0+y1)/2-0.19, mz), _q, new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket('steel').push(g);
    for(let i=0;i<=4;i++){
      const t = i*run/4, yy = y0 + (y1-y0)*(t/run);
      const px = long ? x0+sgn*t : x0+ox, pz = long ? z0+oz : z0+sgn*t;
      addBox('steel', px, yy+0.53, pz, 0.05, 1.06, 0.05, {collide:false, d:1});
    }
    // поручень по уклону
    const gh = new THREE.BoxGeometry(long?dl:0.055, 0.055, long?0.055:dl);
    _m4.compose(new THREE.Vector3(mx, (y0+y1)/2+1.06, mz), _q, new THREE.Vector3(1,1,1));
    gh.applyMatrix4(_m4); bucket('steel').push(gh);
  }
  // марш непроходим сбоку: тонкая стенка-ограждение вдоль обоих косоуров
  for(const s of [-1,1]){
    const cx = long ? x0 + sgn*run/2 : x0 + s*width/2;
    const cz = long ? z0 + s*width/2 : z0 + sgn*run/2;
    COLLIDERS.push({
      x0:cx-(long?run/2:0.05), y0:y0, z0:cz-(long?0.05:run/2),
      x1:cx+(long?run/2:0.05), y1:y1+1.1, z1:cz+(long?0.05:run/2)});
  }
}
/** Перила по краю площадки (без вертикальной преграды на стыке с дверью). */
function guardRail(x1,z1,x2,z2,y,h=1.08){
  const len = Math.hypot(x2-x1, z2-z1); if(len<0.1) return;
  const ux=(x2-x1)/len, uz=(z2-z1)/len, ang=Math.atan2(x2-x1, z2-z1);
  const n = Math.max(1, Math.round(len/1.2));
  for(let i=0;i<=n;i++)
    addBox('steel', x1+ux*i*len/n, y+h/2, z1+uz*i*len/n, 0.05,h,0.05, {collide:false, d:1});
  for(const yy of [y+h-0.03, y+h*0.5]){
    const g = new THREE.BoxGeometry(0.05,0.05,len);
    _e.set(0,ang,0); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3((x1+x2)/2,yy,(z1+z2)/2),_q,new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket('steel').push(g);
  }
  // отбортовка понизу
  const gb = new THREE.BoxGeometry(0.03,0.12,len);
  _e.set(0,ang,0); _q.setFromEuler(_e);
  _m4.compose(new THREE.Vector3((x1+x2)/2,y+0.06,(z1+z2)/2),_q,new THREE.Vector3(1,1,1));
  gb.applyMatrix4(_m4); bucket('steel').push(gb);
  const cx=(x1+x2)/2, cz=(z1+z2)/2;
  const ex=Math.abs(ux)>0.5?len/2:0.07, ez=Math.abs(ux)>0.5?0.07:len/2;
  COLLIDERS.push({x0:cx-ex,y0:y,z0:cz-ez,x1:cx+ex,y1:y+h,z1:cz+ez});
}

function buildExternalAccess(){
  const Y2 = F2+DECK_T;
  const PD = 2.0, PW = 1.6;              // вынос площадки и полуширина
  const RUN = 7.2;                       // длина марша по горизонтали

  /* Марши уходят от фасада наружу, а не вдоль него: так наружная лестница
     не перекрывает двери и окна первого этажа. */
  const bay = (ax, az, nx, nz) => {
    // (nx,nz) — единичная внешняя нормаль фасада
    const px = ax + nx*PD/2, pz = az + nz*PD/2;
    // площадка у двери
    const hx = Math.abs(nx) > 0.5 ? PD/2 : PW, hz = Math.abs(nx) > 0.5 ? PW : PD/2;
    platform(px-hx, pz-hz, px+hx, pz+hz, Y2);
    // перила по бокам площадки (фасад и марш остаются открытыми)
    if(Math.abs(nx) > 0.5){
      guardRail(px-hx, pz-hz, px+hx, pz-hz, Y2);
      guardRail(px-hx, pz+hz, px+hx, pz+hz, Y2);
    } else {
      guardRail(px-hx, pz-hz, px-hx, pz+hz, Y2);
      guardRail(px+hx, pz-hz, px+hx, pz+hz, Y2);
    }
    // Марш строится снизу вверх, поэтому начинается у земли на дальнем конце
    // и поднимается обратно к площадке — иначе верх окажется на улице.
    const sx = ax + nx*(PD+RUN), sz = az + nz*(PD+RUN);
    const dir = Math.abs(nx) > 0.5 ? (nx > 0 ? '-x' : '+x') : (nz > 0 ? '-z' : '+z');
    steelStairs(sx, sz, dir, 0, Y2, 1.5, RUN);
    // промежуточная опора марша
    addBox('steel', ax + nx*(PD+RUN*0.5), Y2*0.26, az + nz*(PD+RUN*0.5),
           0.12, Y2*0.52, 0.12, {d:1.1});
  };

  for(const d of EXT_DOORS){
    if(d.side === 'n') bay(d.at, BZ0, 0, -1);
    else if(d.side === 's') bay(d.at, BZ1, 0, 1);
    else if(d.side === 'w') bay(BX0, d.at, -1, 0);
    // восточная дверь обслуживается мостом из гаража (см. buildPOI)
  }
}

/* ============================================================================
   СВЕТ
   Солнце — одно, с высоким разрешением тени; проёмы в кровле сами дают
   световые пятна на полу, потому что кровля отбрасывает тень.
============================================================================ */
let sun, hemi, ambient, NIGHT=false;
const FILLS=[], LIGHT_POOL=[], SHAFTS=[];
let sunTarget;

function buildLights(){
  hemi = new THREE.HemisphereLight(0xaebfd0, 0x8a7e6c, 0.68); scene.add(hemi);
  ambient = new THREE.AmbientLight(0xdfe3e6, 0.16); scene.add(ambient);

  sun = new THREE.DirectionalLight(0xfff2dc, 5.4);
  sun.position.set(-46, 54, 30);
  sunTarget = new THREE.Object3D(); sunTarget.position.set(2,0,-4); scene.add(sunTarget);
  sun.target = sunTarget;
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096,4096);
  const c = sun.shadow.camera;
  c.left=-58; c.right=58; c.top=50; c.bottom=-50; c.near=1; c.far=170;
  sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.034;
  scene.add(sun);

  // мягкие заполняющие от остекления (без теней — дёшево)
  const f1 = new THREE.DirectionalLight(0xc6d4e6, 0.5); f1.position.set(30,14,-26); scene.add(f1);
  const f2 = new THREE.DirectionalLight(0xbcc8d8, 0.34); f2.position.set(-30,13,26); scene.add(f2);
  const f3 = new THREE.DirectionalLight(0xe8e2d4, 0.28); f3.position.set(6,24,2);   scene.add(f3);
  // отражённый от бетонного пола свет — иначе низ кровли и фермы уходят в смолу
  const bounce = new THREE.DirectionalLight(0xd4cbba, 0.55);
  bounce.position.set(0,-20,0); scene.add(bounce);
  FILLS.push(f1,f2,f3,bounce);

  for(let i=0;i<6;i++){
    const L = new THREE.PointLight(0xe6e4dc, 0, 16, 2);
    L.position.set(0,-60,0); scene.add(L); LIGHT_POOL.push(L);
  }
}

/* --- Объёмные световые столбы из проёмов кровли (аддитивные конусы) --- */
const shaftMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
  uniforms:{ uColor:{value:new THREE.Color(0xffe8c4)}, uOpacity:{value:0.055}, uTime:{value:0} },
  vertexShader:`
    varying vec3 vPos; varying vec2 vUv;
    void main(){ vUv=uv; vPos=position;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uOpacity, uTime;
    varying vec3 vPos; varying vec2 vUv;
    void main(){
      // затухание к низу столба и к его краям
      float h = clamp(vUv.y, 0.0, 1.0);
      float fade = pow(1.0 - h, 2.1);
      // мягкие края: иначе конус читается как непрозрачная белая стена
      float edge = smoothstep(0.0, 0.46, vUv.x) * smoothstep(1.0, 0.54, vUv.x);
      edge = pow(edge, 1.6);
      float flick = 0.94 + 0.06*sin(uTime*0.6 + vPos.x*0.5);
      gl_FragColor = vec4(uColor, uOpacity*fade*edge*flick);
    }`
});
function buildShafts(){
  const dir = new THREE.Vector3().subVectors(sunTarget.position, sun.position).normalize();
  for(const h of SUNHOLES){
    if(!h.open) continue;
    const len = (h.y - 0.0) / Math.max(0.2, -dir.y);   // до пола
    const end = new THREE.Vector3(h.x,h.y,h.z).addScaledVector(dir, len);
    // столб как вытянутая коробка вдоль направления солнца
    const g = new THREE.CylinderGeometry(Math.max(h.w,h.d)*0.55, Math.max(h.w,h.d)*0.78, len, 14, 1, true);
    const m = new THREE.Mesh(g, shaftMat);
    m.position.set((h.x+end.x)/2, (h.y+end.y)/2, (h.z+end.z)/2);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), dir);
    m.renderOrder = 3; m.frustumCulled = true;
    scene.add(m); SHAFTS.push(m);
    // яркое пятно на полу
    const spot = new THREE.Mesh(new THREE.CircleGeometry(Math.max(h.w,h.d)*0.62, 20),
      new THREE.MeshBasicMaterial({color:0xffeccd, transparent:true, opacity:0.055,
        blending:THREE.AdditiveBlending, depthWrite:false}));
    spot.rotation.x = -Math.PI/2; spot.position.set(end.x, 0.012, end.z);
    scene.add(spot); SHAFTS.push(spot);
  }
  // лучи из ленточного остекления — широкие плоские «пластины» света
  for(const w of WINDOWS){
    if(srnd() > 0.34) continue;
    const len = 13;
    const g = new THREE.PlaneGeometry(w.w*1.1, len);
    const m = new THREE.Mesh(g, shaftMat.clone());
    m.material.uniforms.uOpacity.value = 0.022;
    const d = new THREE.Vector3().subVectors(sunTarget.position, sun.position).normalize();
    const end = w.pos.clone().addScaledVector(d, len*0.5);
    m.position.copy(end);
    m.lookAt(w.pos.clone().add(new THREE.Vector3(0,0,0)));
    m.rotateX(Math.PI/2);
    m.renderOrder = 3;
    scene.add(m); SHAFTS.push(m);
  }
}
/* --- Пыль в воздухе: точки, подсвеченные в лучах --- */
let dust;
function buildDust(){
  const N = 5200;
  const pos = new Float32Array(N*3), rndv = new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]   = sr(-HW+1, HW-1);
    pos[i*3+1] = sr(0.2, EAVE-0.5);
    pos[i*3+2] = sr(-HD+1, HD-1);
    rndv[i] = srnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aRnd', new THREE.BufferAttribute(rndv,1));
  const m = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uSize:{value:1.15}, uOpacity:{value:0.5},
               uPixelRatio:{value:renderer.getPixelRatio()} },
    vertexShader:`
      attribute float aRnd; uniform float uTime,uSize,uPixelRatio;
      varying float vA;
      void main(){
        vec3 p = position;
        // медленный дрейф по воздуху
        p.x += sin(uTime*0.10 + aRnd*31.4)*0.55;
        p.y += sin(uTime*0.07 + aRnd*17.7)*0.35;
        p.z += cos(uTime*0.09 + aRnd*23.1)*0.55;
        vec4 mv = modelViewMatrix*vec4(p,1.0);
        gl_Position = projectionMatrix*mv;
        gl_PointSize = clamp(uSize*uPixelRatio*(9.0/max(-mv.z,1.0)), 0.6, 3.2);
        // ближе к свету сверху — ярче
        vA = (0.30 + 0.70*aRnd) * smoothstep(0.0,3.0,p.y);
      }`,
    fragmentShader:`
      uniform float uOpacity; varying float vA;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float a = smoothstep(0.5, 0.06, length(d));
        gl_FragColor = vec4(vec3(1.0,0.95,0.86), a*vA*uOpacity);
      }`
  });
  dust = new THREE.Points(g, m);
  dust.frustumCulled = false;
  scene.add(dust);
}
function updateLightPool(pos){
  if(!LAMPS.length) return;
  LAMPS.forEach(l => l.d = (l.pos.x-pos.x)**2 + (l.pos.z-pos.z)**2);
  const near = LAMPS.filter(l=>l.on).sort((a,b)=>a.d-b.d).slice(0, LIGHT_POOL.length);
  const power = NIGHT ? 7.0 : 2.6;
  near.forEach((l,i)=>{
    const L = LIGHT_POOL[i];
    L.position.copy(l.pos);
    L.intensity = power * clamp(1 - Math.sqrt(l.d)/24, 0, 1);
  });
  for(let i=near.length;i<LIGHT_POOL.length;i++) LIGHT_POOL[i].intensity = 0;
}
function setNight(on){
  NIGHT = on;
  sun.intensity = on ? 0.06 : 4.6;
  hemi.intensity = on ? 0.12 : 0.68;
  ambient.intensity = on ? 0.05 : 0.20;
  FILLS.forEach((f,i)=> f.intensity = on ? 0.03 : [0.5,0.34,0.28,0.55][i]);
  for(const s of SHAFTS) s.visible = !on;
  if(dust) dust.material.uniforms.uOpacity.value = on ? 0.10 : 0.42;
  scene.fog.color.set(on ? 0x05070c : 0x9aa0a6);
  if(SKY) SKY.material.color.set(on ? 0x0c1220 : 0xffffff);
  scene.fog.density = on ? 0.014 : 0.0048;
  scene.background = new THREE.Color(on ? 0x04050a : 0x14151a);
  M.glass.color.set(on ? 0x2b3a52 : 0xc4cfd6);
  scene.environmentIntensity = on ? 0.12 : 1.0;
  renderer.toneMappingExposure = on ? 1.30 : 1.02;
}

/** Зоны, которые реквизит занимать не должен: марши и проёмы лестниц. */
const NOPROP = [
  {x0:-19.2, z0:-11.2, x1:-16.0, z1:-3.8},   // левая лестница + проём
  {x0: 16.0, z0:-11.2, x1: 19.2, z1:-3.8},   // правая лестница + проём
  {x0:-10.0, z0:-14.6, x1:-6.0, z1:-12.0},   // наружные лестницы у фасадов
  {x0:  6.0, z0:-14.6, x1: 14.0, z1:-12.0},
  {x0: -9.0, z0: 12.0, x1: -3.0, z1: 15.0},
  {x0:-23.0, z0:  4.0, x1:-19.0, z1:  9.0},
  // площадки точек интереса: реквизит расставляется внутри их собственных
  // функций, случайный мусор поверх машин и вертолёта недопустим
  {x0:-35.0, z0:-26.0, x1:-27.0, z1:-18.0},  // пиратский флаг
  {x0: 20.0, z0:-25.0, x1: 39.0, z1: -4.0},  // гараж и рампа
  {x0:-37.0, z0:  9.0, x1:-17.0, z1: 30.0},  // вертолётная площадка
  {x0: 21.0, z0: 12.0, x1: 39.0, z1: 28.0},  // водонапорная башня и ГСМ
  {x0:-10.0, z0: -8.0, x1: 10.0, z1:  8.0}   // центральный штабель
];
function inNoProp(x,z){
  if(POI_PLACING) return false;      // объекты точек интереса ставятся точно
  return NOPROP.some(n => x > n.x0 && x < n.x1 && z > n.z0 && z < n.z1);
}
/** Пока true, snapSupport не отбраковывает точки внутри зон NOPROP:
    реквизит точек интереса расставлен вручную и не должен отсеиваться. */
let POI_PLACING = false;
/** Возвращает отметку реальной опоры под точкой. Без этого пропы на уровне
    2 этажа повисают в воздухе там, где настила нет (атриум, лестничные проёмы). */
function snapSupport(x, z, yWanted){
  if(inNoProp(x,z)) return null;              // сюда ничего не ставим
  let best = null;
  for(const c of COLLIDERS){
    if(x <= c.x0 || x >= c.x1 || z <= c.z0 || z >= c.z1) continue;
    if(c.y1 > yWanted + 0.45) continue;                 // выше искомой отметки — не опора
    if(best === null || c.y1 > best) best = c.y1;
  }
  if(best === null) return 0;                           // нет опоры → на бетон
  return Math.abs(best - yWanted) < 0.45 ? yWanted : best;
}
function meshAt(geo, mat, x,y,z, opt={}){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  if(opt.rotY) m.rotation.y = opt.rotY;
  if(opt.rotX) m.rotation.x = opt.rotX;
  if(opt.rotZ) m.rotation.z = opt.rotZ;
  m.castShadow = opt.cast !== false; m.receiveShadow = true;
  scene.add(m); SHOOTABLE.push(m);
  return m;
}

/* ---------- Строительные леса: главный вертикальный объект недостроя ---------- */
function scaffold(x,y,z,rotY,bays=2,levels=2){
  y = snapSupport(x,z,y); if(y === null) return;
  const BW=1.9, BD=1.15, LH=1.95;
  for(let b=0;b<=bays;b++){
    for(const sd of [-1,1]){
      const ox = -bays*BW/2 + b*BW, oz = sd*BD/2;
      const px = x + Math.cos(rotY)*ox - Math.sin(rotY)*oz;
      const pz = z - Math.sin(rotY)*ox - Math.cos(rotY)*oz;
      addBox('steel', px, y+levels*LH/2, pz, 0.055, levels*LH, 0.055, {collide:false, d:1.2});
    }
  }
  for(let l=1;l<=levels;l++){
    const ly = y + l*LH;
    // ригели вдоль и поперёк
    addBox('steel', x, ly, z, bays*BW, 0.05, 0.05, {rotY, collide:false, d:1.2});
    for(const sd of [-1,1]){
      const oz = sd*BD/2;
      addBox('steel', x - Math.sin(rotY)*oz, ly-0.02, z - Math.cos(rotY)*oz,
             bays*BW, 0.05, 0.05, {rotY, collide:false, d:1.2});
    }
    // настил из досок
    for(let d=0;d<4;d++){
      const oz = -BD/2 + 0.16 + d*0.28;
      addBox('wood', x - Math.sin(rotY)*oz, ly+0.06, z - Math.cos(rotY)*oz,
             bays*BW-0.1, 0.035, 0.26, {rotY, collide:false, d:1.1});
    }
    addAABB(x, ly+0.05, z, bays*BW, 0.12, BD, rotY);
    // диагональные раскосы
    for(let b=0;b<bays;b++){
      const ox = -bays*BW/2 + b*BW + BW/2;
      const len = Math.hypot(BW, LH);
      const g = new THREE.BoxGeometry(len, 0.04, 0.04);
      g.rotateZ(Math.atan2(LH, BW) * (b%2?1:-1));
      _e.set(0,rotY,0); _q.setFromEuler(_e);
      const px = x + Math.cos(rotY)*ox, pz = z - Math.sin(rotY)*ox;
      _m4.compose(new THREE.Vector3(px, ly-LH/2, pz + (rotY?0:BD/2)), _q, new THREE.Vector3(1,1,1));
      g.applyMatrix4(_m4); bucket('steel').push(g);
    }
  }
}

function hangingTarp(x,y,z,rotY,w=2.2,h=2.6){
  const seg = 10;
  const g = new THREE.PlaneGeometry(w, h, seg, 6);
  const pos = g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const u = (pos.getX(i)/w + 0.5), v = (pos.getY(i)/h + 0.5);
    // провис и складки: сверху закреплено, снизу свободно
    pos.setZ(i, Math.sin(u*Math.PI*3.2)*0.10*(1-v) + Math.sin(v*4.0)*0.04);
    pos.setX(i, pos.getX(i)*(1 - 0.06*(1-v)));
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color:0xbcc2c0, roughness:.82, metalness:0, side:THREE.DoubleSide,
    transparent:true, opacity:.55 }));
  m.position.set(x,y,z); m.rotation.y = rotY;
  m.castShadow = true; scene.add(m);
}

/* ============================================================================
   ТЕХНИКА: машины и вертолёт
   Все машины — статичные укрытия, без интерактива. Геометрия собирается из
   скруглённых объёмов: кузов, остекление, колёсные арки, хром, оптика.
============================================================================ */
/** Скруглённая коробка: база любого кузовного объёма.
    Дешевле ExtrudeGeometry и даёт корректные нормали для бликов. */
function roundedBox(w,h,d,r=0.12,seg=3){
  r = Math.min(r, w/2-0.001, h/2-0.001, d/2-0.001);
  const g = new THREE.BoxGeometry(w,h,d, seg*2, seg*2, seg*2);
  const p = g.attributes.position;
  const hw=w/2-r, hh=h/2-r, hd=d/2-r;
  const v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    // точка проецируется на поверхность скруглённого параллелепипеда
    const cx = clamp(v.x,-hw,hw), cy = clamp(v.y,-hh,hh), cz = clamp(v.z,-hd,hd);
    const dx=v.x-cx, dy=v.y-cy, dz=v.z-cz;
    const l = Math.hypot(dx,dy,dz);
    if(l > 1e-6) p.setXYZ(i, cx+dx/l*r, cy+dy/l*r, cz+dz/l*r);
  }
  g.computeVertexNormals();
  return g;
}
/** Колесо: покрышка с протектором + диск со спицами и ступицей. */
function wheelGroup(R=0.36, W=0.24, spokes=5){
  const g = new THREE.Group();
  const tyre = new THREE.Mesh(new THREE.CylinderGeometry(R,R,W,22,1), M.rubber);
  tyre.rotation.z = Math.PI/2; g.add(tyre);
  // протектор: блоки по окружности
  const tread = [];
  for(let i=0;i<22;i++){
    const a = i/22*Math.PI*2;
    const b = new THREE.BoxGeometry(W*0.92, 0.035, R*0.17);
    b.translate(0, R-0.012, 0); b.rotateX(a);
    tread.push(b);
  }
  const tm = new THREE.Mesh(BGU.mergeGeometries(tread,false), M.rubber);
  tm.rotation.z = Math.PI/2; g.add(tm);
  // боковина: небольшой валик, иначе покрышка читается как труба
  for(const s of [-1,1]){
    const side = new THREE.Mesh(new THREE.TorusGeometry(R*0.88, R*0.1, 6, 20), M.rubber);
    side.position.x = s*W*0.44; side.rotation.y = Math.PI/2; g.add(side);
  }
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(R*0.66,R*0.66,W*0.5,18), M.chrome);
  disc.rotation.z = Math.PI/2; g.add(disc);
  for(let i=0;i<spokes;i++){
    const sp = new THREE.Mesh(new THREE.BoxGeometry(W*0.3, R*1.15, R*0.16), M.chrome);
    sp.rotation.x = i*Math.PI/spokes; g.add(sp);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(R*0.2,R*0.2,W*0.62,12), M.chrome);
  hub.rotation.z = Math.PI/2; g.add(hub);
  g.traverse(o=>{ o.castShadow=true; o.receiveShadow=true; });
  return g;
}
/** Легковой хэтчбек/седан: капот, салон, багажник, оптика, зеркала. */
function car(x,y,z,rotY, mat, opt={}){
  y = snapSupport(x,z,y); if(y === null) return;
  const G = new THREE.Group();
  const L = opt.len ?? 4.3, W = opt.wid ?? 1.82, R = opt.wheel ?? 0.33;
  // Профиль по трём отметкам: низ порога, поясная линия (верх капота и
  // дверей) и крыша. Кузов уже колеи, поэтому колёса выступают по бортам
  // и не тонут в объёме — иначе машина читается как плита на катках.
  const sill = 0.38, belt = 1.02, roofY = 1.48;
  const bodyH = belt - sill, cabH = roofY - belt;
  const BW = W - R*0.62;                          // ширина кузова между арками
  const cabL = L*0.48, cabC = -L*0.07;            // длина и центр кабины

  // нижний объём кузова
  const body = new THREE.Mesh(roundedBox(L, bodyH, BW, 0.20, 4), mat);
  body.position.y = sill + bodyH/2; G.add(body);
  // «крылья» над колёсами: расширяют кузов только у арок
  for(const sx of [L*0.30, -L*0.31]){
    const fend = new THREE.Mesh(roundedBox(R*2.5, bodyH*0.86, W, 0.22, 4), mat);
    fend.position.set(sx, sill + bodyH*0.56, 0); G.add(fend);
  }
  // пороги между арками
  const rocker = new THREE.Mesh(roundedBox(L*0.44, bodyH*0.42, W*0.96, 0.08, 3), mat);
  rocker.position.set(cabC, sill + bodyH*0.22, 0); G.add(rocker);
  // скруглённые свесы носа и кормы
  for(const [px,len] of [[L*0.44, L*0.14], [-L*0.45, L*0.12]]){
    const end = new THREE.Mesh(roundedBox(len, bodyH*0.78, BW*0.96, 0.14, 3), mat);
    end.position.set(px, sill + bodyH*0.46, 0); G.add(end);
  }

  // кабина: уже кузова, с наклонными стойками
  const cab = new THREE.Mesh(roundedBox(cabL, cabH, BW*0.94, 0.16, 4), mat);
  cab.position.set(cabC, belt + cabH/2, 0); G.add(cab);
  const roof = new THREE.Mesh(roundedBox(cabL*0.74, 0.08, BW*0.84, 0.06, 3), mat);
  roof.position.set(cabC - L*0.01, roofY - 0.02, 0); G.add(roof);
  // Тёмный салон: без него стекло висит поверх кузовной краски и читается
  // как наклейка, а не как проём.
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(cabL*0.94, cabH*0.86, BW*0.90),
    new THREE.MeshStandardMaterial({color:0x17181b, roughness:.95}));
  cabin.position.set(cabC, belt + cabH*0.48, 0); G.add(cabin);

  /* --- остекление: плоскость сначала разворачивается по Y, потом
     наклоняется вокруг СВОЕЙ оси X (rotateX), иначе порядок Эйлера XYZ
     даёт скошенный «клин» вместо наклонного стекла. --- */
  const gl = (w,h,px,py,pz,ry,tilt)=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), M.carGlass);
    m.position.set(px,py,pz);
    m.rotation.set(0, ry||0, 0);
    if(tilt) m.rotateX(tilt);
    m.renderOrder = 1; G.add(m);
  };
  const winY = belt + cabH*0.52;
  gl(cabL*0.78, cabH*0.58, cabC, winY,  BW*0.474, 0);
  gl(cabL*0.78, cabH*0.58, cabC, winY, -BW*0.474, Math.PI);
  gl(BW*0.86, cabH*0.92, cabC+cabL*0.46, winY+0.02,  0,  Math.PI/2, -0.34);  // лобовое
  gl(BW*0.82, cabH*0.84, cabC-cabL*0.46, winY+0.02,  0, -Math.PI/2, -0.28);  // заднее
  // стойки A/B/C
  for(const [px,tilt] of [[cabC+cabL*0.46,-0.34],[cabC+cabL*0.02,0],[cabC-cabL*0.46,0.3]])
    for(const s of [-1,1]){
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, cabH*0.92, 0.05), mat);
      b.position.set(px, belt+cabH*0.5, s*BW*0.47); b.rotation.z = tilt; G.add(b);
    }

  /* --- бамперы, пороги, светотехника --- */
  for(const s of [1,-1]){
    const bump = new THREE.Mesh(roundedBox(0.16, 0.26, W*0.99, 0.07, 3), M.darker);
    bump.position.set(s*L*0.485, sill+0.12, 0); G.add(bump);
  }
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(L*0.46, 0.1, W*0.99), M.darker);
  skirt.position.set(cabC, sill + 0.01, 0); G.add(skirt);
  const grille = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, W*0.56), M.darker);
  grille.position.set(L*0.497, belt-0.26, 0); G.add(grille);
  for(const s of [-1,1]){
    const hl = new THREE.Mesh(roundedBox(0.08, 0.17, 0.36, 0.05, 2), M.headlamp);
    hl.position.set(L*0.492, belt-0.18, s*BW*0.34); G.add(hl);
    const tl = new THREE.Mesh(roundedBox(0.06, 0.18, 0.32, 0.05, 2), M.lightRed);
    tl.position.set(-L*0.494, belt-0.16, s*BW*0.34); G.add(tl);
    // зеркала на стойке A
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.04,0.1), mat);
    arm.position.set(cabC+cabL*0.42, winY-0.06, s*BW*0.5); G.add(arm);
    const mir = new THREE.Mesh(roundedBox(0.09,0.1,0.17,0.035,2), mat);
    mir.position.set(cabC+cabL*0.42, winY-0.06, s*BW*0.58); G.add(mir);
    // ручки дверей на поясной линии
    for(const px of [cabC-L*0.14, cabC+L*0.10]){
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.04,0.035), M.chrome);
      h.position.set(px, belt-0.14, s*BW*0.51); G.add(h);
    }
    // молдинг по борту
    const trim = new THREE.Mesh(new THREE.BoxGeometry(L*0.5,0.05,0.03), M.darker);
    trim.position.set(cabC, belt-0.28, s*BW*0.51); G.add(trim);
  }
  // разрезы дверей
  for(const s of [-1,1]) for(const px of [cabC-cabL*0.5, cabC, cabC+cabL*0.5]){
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.012, bodyH*0.86, 0.006), M.darker);
    seam.position.set(px, sill+bodyH/2, s*BW*0.505); G.add(seam);
  }
  /* --- колёса в арках --- */
  for(const sx of [L*0.30, -L*0.31]) for(const sz of [-1,1]){
    const w = wheelGroup(R, 0.23, 5);
    w.position.set(sx, R, sz*(W/2-0.12));
    w.rotation.y = (opt.turn && sx>0) ? opt.turn : 0;
    G.add(w);
    // кромка арки: тёмное полукольцо по краю крыла
    const arch = new THREE.Mesh(new THREE.TorusGeometry(R*1.2, 0.05, 6, 16, Math.PI), M.darker);
    arch.position.set(sx, R, sz*(W/2-0.01)); arch.rotation.y = Math.PI/2; G.add(arch);
  }
  const exh = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.16,10), M.chrome);
  exh.rotation.z = Math.PI/2; exh.position.set(-L*0.49, sill+0.06, W*0.26); G.add(exh);

  G.position.set(x,y,z); G.rotation.y = rotY;
  G.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  scene.add(G); SHOOTABLE.push(G);
  addAABB(x, y+roofY/2, z, L, roofY, W, rotY);
  return G;
}
/** Фургон/микроавтобус: высокий кузов, сдвижная дверь, лестница сзади. */
function van(x,y,z,rotY, mat, opt={}){
  y = snapSupport(x,z,y); if(y === null) return;
  const G = new THREE.Group();
  const L = opt.len ?? 5.2, W = opt.wid ?? 2.0, R = 0.37;
  const sill = 0.34, boxH = 1.72;

  const body = new THREE.Mesh(roundedBox(L*0.74, boxH, W, 0.16, 4), mat);
  body.position.set(-L*0.12, sill+boxH/2, 0); G.add(body);
  // капот-«морда»
  const nose = new THREE.Mesh(roundedBox(L*0.30, boxH*0.62, W*0.96, 0.22, 4), mat);
  nose.position.set(L*0.34, sill+boxH*0.34, 0); G.add(nose);
  // тёмная кабина за стеклом
  const cabIn = new THREE.Mesh(new THREE.BoxGeometry(L*0.2, boxH*0.42, W*0.86),
    new THREE.MeshStandardMaterial({color:0x17181b, roughness:.95}));
  cabIn.position.set(L*0.16, sill+boxH*0.70, 0); G.add(cabIn);
  const wind = new THREE.Mesh(new THREE.PlaneGeometry(W*0.88, boxH*0.48), M.carGlass);
  wind.position.set(L*0.20, sill+boxH*0.72, 0);
  wind.rotation.set(0, Math.PI/2, 0); wind.rotateX(-0.24); G.add(wind);
  for(const s of [-1,1]){
    const side = new THREE.Mesh(new THREE.PlaneGeometry(L*0.2, boxH*0.34), M.carGlass);
    side.position.set(L*0.10, sill+boxH*0.70, s*W*0.502);
    side.rotation.set(0, s>0 ? 0 : Math.PI, 0); G.add(side);
  }
  // гофры борта — жёсткость кузова
  for(const s of [-1,1]) for(let i=0;i<7;i++){
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.05, boxH*0.78, 0.03), mat);
    rib.position.set(-L*0.42 + i*L*0.10, sill+boxH*0.48, s*W*0.505); G.add(rib);
  }
  // задние створки со стеклом и ручками
  for(const s of [-1,1]){
    const dr = new THREE.Mesh(new THREE.BoxGeometry(0.05, boxH*0.92, W*0.46), mat);
    dr.position.set(-L*0.485, sill+boxH*0.5, s*W*0.245); G.add(dr);
    const gl = new THREE.Mesh(new THREE.PlaneGeometry(W*0.36, boxH*0.28), M.carGlass);
    gl.position.set(-L*0.512, sill+boxH*0.78, s*W*0.245);
    gl.rotation.y = -Math.PI/2; G.add(gl);
    const hd = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.3,0.04), M.chrome);
    hd.position.set(-L*0.515, sill+boxH*0.45, s*0.1); G.add(hd);
    const tl = new THREE.Mesh(roundedBox(0.06,0.34,0.16,0.04,2), M.lightRed);
    tl.position.set(-L*0.50, sill+0.30, s*W*0.42); G.add(tl);
    const hl = new THREE.Mesh(roundedBox(0.08,0.18,0.28,0.05,2), M.headlamp);
    hl.position.set(L*0.485, sill+0.46, s*W*0.34); G.add(hl);
  }
  const bump = new THREE.Mesh(roundedBox(0.16,0.26,W*0.99,0.07,3), M.darker);
  bump.position.set(L*0.49, sill+0.10, 0); G.add(bump);
  const bumpR = new THREE.Mesh(roundedBox(0.14,0.24,W*0.99,0.07,3), M.darker);
  bumpR.position.set(-L*0.50, sill+0.10, 0); G.add(bumpR);
  // лестница на крышу и багажник
  for(const s of [-1,1]){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(L*0.6,0.05,0.05), M.steel);
    rail.position.set(-L*0.12, sill+boxH+0.06, s*W*0.36); G.add(rail);
  }
  for(let i=0;i<6;i++){
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.04,0.4), M.steel);
    st.position.set(-L*0.52, sill+0.34+i*0.26, W*0.30); G.add(st);
  }
  for(const sx of [L*0.32, -L*0.28]) for(const sz of [-1,1]){
    const w = wheelGroup(R, 0.26, 6);
    w.position.set(sx, R, sz*(W/2-0.11)); G.add(w);
    const arch = new THREE.Mesh(new THREE.TorusGeometry(R*1.1, 0.06, 6, 14, Math.PI), M.darker);
    arch.position.set(sx, R, sz*(W/2-0.01)); arch.rotation.y = Math.PI/2; G.add(arch);
  }
  G.position.set(x,y,z); G.rotation.y = rotY;
  G.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  scene.add(G); SHOOTABLE.push(G);
  addAABB(x, y+(sill+boxH)/2, z, L, sill+boxH, W, rotY);
  return G;
}
/** Пикап с кунгом-каркасом: длинная база, рама, кузовной борт. */
function pickup(x,y,z,rotY, mat){

  const nose = new THREE.Mesh(roundedBox(L*0.26, cabH*0.62, W*0.97, 0.16, 4), mat);

  const wY = sill+cabH*0.68;
  const cabIn = new THREE.Mesh(new THREE.BoxGeometry(L*0.34, cabH*0.5, W*0.86),

  const rear = new THREE.Mesh(new THREE.PlaneGeometry(W*0.82, cabH*0.38), M.carGlass);
  rear.position.set(-L*0.072, wY, 0); rear.rotation.set(0, -Math.PI/2, 0); G.add(rear);
  for(const s of [-1,1]){
    const side = new THREE.Mesh(new THREE.PlaneGeometry(L*0.26, cabH*0.38), M.carGlass);
    side.position.set(L*0.10, wY, s*W*0.502); side.rotation.set(0, s>0?0:Math.PI, 0); G.add(side);
    const hl = new THREE.Mesh(roundedBox(0.08,0.16,0.3,0.05,2), M.headlamp);
    hl.position.set(L*0.52, sill+0.34, s*W*0.32); G.add(hl);
    const tl = new THREE.Mesh(roundedBox(0.06,0.2,0.16,0.04,2), M.lightRed);
    tl.position.set(-L*0.47, sill+0.22, s*W*0.42); G.add(tl);
  }
  // силовой бампер и шноркель
  const bull = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.5,W*0.9), M.steel);
  bull.position.set(L*0.53, sill+0.16, 0); G.add(bull);
  for(const s of [-1,1]){
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.7,8), M.steel);
    bar.position.set(L*0.53, sill+0.4, s*0.32); G.add(bar);
  }
  const snork = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.3,10), M.darker);
  snork.position.set(L*0.26, sill+cabH*0.6, W*0.48); G.add(snork);
  for(const sx of [L*0.34, -L*0.30]) for(const sz of [-1,1]){
    const w = wheelGroup(R, 0.30, 6);
    w.position.set(sx, R, sz*(W/2-0.10)); G.add(w);
    const arch = new THREE.Mesh(new THREE.TorusGeometry(R*1.14, 0.07, 6, 14, Math.PI), M.darker);
    arch.position.set(sx, R, sz*(W/2)); arch.rotation.y = Math.PI/2; G.add(arch);
  }
  G.position.set(x,y,z); G.rotation.y = rotY;
  G.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  scene.add(G); SHOOTABLE.push(G);
  addAABB(x, y+(sill+cabH)/2, z, L, sill+cabH, W, rotY);
  return G;
}
/** Кузов на подпорках без колёс — «донор» в углу гаража. */
function carWreck(x,y,z,rotY){
  y = snapSupport(x,z,y); if(y === null) return;
  const G = new THREE.Group();
  const L=4.1, W=1.76, sill=0.42, bodyH=0.72, cabH=0.5;
  const shell = new THREE.Mesh(roundedBox(L,bodyH,W,0.24,4), M.carBlack);
  shell.position.y = sill+bodyH/2; G.add(shell);

  cab.position.set(-L*0.04, sill+bodyH+cabH/2-0.06, 0); G.add(cab);
  // стёкол нет — проёмы обозначены тёмными вставками
  for(const s of [-1,1]){
    const hole = new THREE.Mesh(new THREE.PlaneGeometry(L*0.34, cabH*0.6), M.darker);
    hole.position.set(-L*0.04, sill+bodyH+cabH*0.5, s*W*0.442);

  scene.add(G); SHOOTABLE.push(G);
  addAABB(x, y+(sill+bodyH+cabH)/2, z, L, sill+bodyH+cabH, W, rotY);
}

/** Лёгкий вертолёт: кабина-«пузырь», хвостовая балка, полозья, несущий винт. */
function helicopter(x,y,z,rotY){
  y = snapSupport(x,z,y); if(y === null) return;
  const G = new THREE.Group();
  const skidY = 0.0, fusY = 1.05;            // отметка полозьев и оси фюзеляжа

  /* --- фюзеляж: сфера кабины + сужающийся хвост --- */
  const pod = new THREE.Mesh(new THREE.SphereGeometry(1.06, 22, 16), M.heliBody);
  pod.scale.set(1.28, 0.94, 1.0); pod.position.set(0.25, fusY, 0); G.add(pod);
  // остекление: передняя полусфера кабины
  const bubble = new THREE.Mesh(new THREE.SphereGeometry(1.03, 22, 16,
    -Math.PI*0.52, Math.PI*1.04, Math.PI*0.14, Math.PI*0.62), M.heliGlass);
  bubble.scale.set(1.30, 0.96, 1.0); bubble.position.set(0.30, fusY, 0);
  bubble.rotation.y = -Math.PI/2; G.add(bubble);
  // переплёт фонаря
  for(const s of [-1,1]){
    const post = new THREE.Mesh(new THREE.TorusGeometry(1.06, 0.032, 5, 18, Math.PI*0.7), M.heliBody);
    post.position.set(0.28, fusY, s*0.42); post.rotation.y = Math.PI/2;
    post.rotation.z = -0.25; post.scale.set(1.24,0.94,1); G.add(post);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.52,16,12), M.heliBody);
  nose.scale.set(1.2,0.8,0.92); nose.position.set(1.42, fusY-0.18, 0); G.add(nose);

  // хвостовая балка
  const boomL = 3.5;
  const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.15, boomL, 14), M.heliBody);
  boom.rotation.z = Math.PI/2; boom.position.set(-1.9, fusY+0.22, 0); G.add(boom);
  // киль и стабилизатор
  const fin = new THREE.Mesh(roundedBox(0.72, 1.0, 0.09, 0.08, 3), M.heliBody);
  fin.position.set(-3.45, fusY+0.78, 0); fin.rotation.z = 0.2; G.add(fin);
  const finLow = new THREE.Mesh(roundedBox(0.4, 0.5, 0.08, 0.06, 2), M.heliBody);
  finLow.position.set(-3.5, fusY-0.18, 0); G.add(finLow);
  const stab = new THREE.Mesh(roundedBox(0.66, 0.06, 1.5, 0.04, 2), M.heliBody);
  stab.position.set(-3.05, fusY+0.32, 0); G.add(stab);
  for(const s of [-1,1]){
    const ep = new THREE.Mesh(roundedBox(0.4,0.34,0.05,0.04,2), M.heliBody);
    ep.position.set(-3.05, fusY+0.48, s*0.72); G.add(ep);
  }
  // рулевой винт
  const trHub = new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,0.18,10), M.darker);
  trHub.rotation.x = Math.PI/2; trHub.position.set(-3.5, fusY+0.72, 0.16); G.add(trHub);
  for(let i=0;i<2;i++){
    const bl = new THREE.Mesh(roundedBox(0.66, 0.11, 0.025, 0.02, 2), M.darker);
    bl.position.set(-3.5, fusY+0.72, 0.22);
    bl.rotation.z = i*Math.PI/2 + 0.4; G.add(bl);
  }

  /* --- несущий винт: втулка, тяги, две лопасти с провисом --- */
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,0.52,12), M.chrome);
  mast.position.set(0.2, fusY+1.02, 0); G.add(mast);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.3,0.2,14), M.steel);
  hub.position.set(0.2, fusY+1.32, 0); G.add(hub);
  const swash = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.07,14), M.chrome);
  swash.position.set(0.2, fusY+1.12, 0); G.add(swash);
  const ROTOR_R = 4.4;
  for(let i=0;i<2;i++){
    const a = i*Math.PI + 0.35;
    const bl = new THREE.Mesh(roundedBox(ROTOR_R, 0.055, 0.34, 0.025, 2), M.darker);
    bl.position.set(0.2 + Math.cos(a)*ROTOR_R/2, fusY+1.30 - 0.14, Math.sin(a)*ROTOR_R/2);
    bl.rotation.y = -a; bl.rotation.z = 0.055;          // провис лопасти на стоянке
    G.add(bl);
    // тяга от втулки к комлю
    const link = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.5,6), M.chrome);
    link.position.set(0.2 + Math.cos(a)*0.34, fusY+1.18, Math.sin(a)*0.34);
    link.rotation.z = 0.5; link.rotation.y = -a; G.add(link);
  }

  /* --- полозья и подкосы --- */
  for(const s of [-1,1]){
    const skid = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,3.3,10), M.steel);
    skid.rotation.z = Math.PI/2; skid.position.set(0.05, skidY+0.06, s*0.95); G.add(skid);
    // загнутый передний конец
    const tip = new THREE.Mesh(new THREE.TorusGeometry(0.28,0.06,6,10,Math.PI/2), M.steel);
    tip.position.set(1.7, skidY+0.34, s*0.95); tip.rotation.y = Math.PI/2;
    tip.rotation.z = -Math.PI/2; G.add(tip);
    for(const px of [0.85, -0.75]){
      const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,1.05,8), M.steel);
      strut.position.set(px, skidY+0.52, s*0.62); strut.rotation.x = -s*0.55; G.add(strut);
    }
  }
  // дверные проёмы и элементы отделки
  for(const s of [-1,1]){
    const door = new THREE.Mesh(new THREE.TorusGeometry(0.52,0.028,5,16), M.heliTrim);
    door.position.set(0.15, fusY-0.02, s*0.98); door.scale.set(1,1.05,1); G.add(door);
  }
  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.303,0.152,0.1,14), M.heliTrim);
  stripe.rotation.z = Math.PI/2; stripe.position.set(-1.9, fusY+0.22, 0); G.add(stripe);
  // выхлоп двигателя и воздухозаборник
  const intake = new THREE.Mesh(roundedBox(0.7,0.34,0.62,0.1,3), M.darker);
  intake.position.set(-0.55, fusY+0.72, 0); G.add(intake);
  const exh = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,0.4,10), M.darker);
  exh.rotation.z = Math.PI/2 - 0.2; exh.position.set(-1.2, fusY+0.6, 0.28); G.add(exh);
  // проблесковый маяк и АНО
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.075,10,8), M.lightRed);
  beacon.position.set(0.2, fusY+1.46, 0); G.add(beacon);
  for(const [s,m] of [[-1,M.lightRed],[1,M.lightAmb]]){
    const nav = new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6), m);
    nav.position.set(0.1, fusY-0.4, s*1.22); G.add(nav);
  }

  G.position.set(x,y,z); G.rotation.y = rotY;
  G.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  scene.add(G); SHOOTABLE.push(G);
  // Коллайдер по корпусу: лопасти висят на 2.4 м и укрытием не служат.
  addAABB(x, y+1.15, z, 5.4, 2.3, 2.3, rotY);
  return G;
}

const POI = [];

/* ---------- 1. Пиратский флаг во всю высоту (СЗ угол) ---------- */
function pirateFlag(x, z, rotY){
  const H = 9.2;                              // мачта выше конька второго этажа

  addBox('panel', x, 0.22, z, 2.2, 0.44, 2.2, {d:.45});

  // мачта: труба с сужением и реями

  COLLIDERS.push({x0:x-0.2,y0:0,z0:z-0.2,x1:x+0.2,y1:0.5+H,z1:z+0.2});
  // рея, на которой висит полотнище
  const yard = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,4.6,10), M.wood);
  yard.rotation.z = Math.PI/2; yard.position.set(x, 0.5+H*0.93, z);
  yard.rotation.y = rotY; yard.castShadow = true; scene.add(yard);
  // ванты к башмаку
  for(let i=0;i<4;i++){
    const a = rotY + i*Math.PI/2 + Math.PI/4;
    const from = new THREE.Vector3(x, 0.5+H*0.82, z);
    const to   = new THREE.Vector3(x+Math.cos(a)*1.9, 0.52, z+Math.sin(a)*1.9);
    const len = from.distanceTo(to);
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,len,5), M.cable);
    rope.position.copy(from).lerp(to,0.5);
    rope.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),
      to.clone().sub(from).normalize());
    rope.castShadow = true; scene.add(rope);
  }
  /* полотнище: сетка с волной, анимируется в кадре */
  const FW = 4.4, FH = 2.75;
  const g = new THREE.PlaneGeometry(FW, FH, 30, 16);
  const flag = new THREE.Mesh(g, M.flag);
  flag.position.set(x + Math.cos(rotY)*FW/2, 0.5+H*0.93-FH/2-0.06, z - Math.sin(rotY)*FW/2);
  flag.rotation.y = rotY;
  flag.castShadow = true; flag.receiveShadow = true;
  scene.add(flag);
  const base = g.attributes.position.array.slice();
  POI.push({kind:'flag', mesh:flag, geo:g, base, w:FW, h:FH});
  // Второе, меньшее полотнище-вымпел под реей: читается издалека.
  const pg = new THREE.PlaneGeometry(1.5, 0.8, 12, 6);
  const pen = new THREE.Mesh(pg, M.flag);
  pen.position.set(x + Math.cos(rotY)*0.9, 0.5+H*0.62, z - Math.sin(rotY)*0.9);
  pen.rotation.y = rotY; pen.castShadow = true; scene.add(pen);
  POI.push({kind:'flag', mesh:pen, geo:pg, base:pg.attributes.position.array.slice(), w:1.5, h:0.8});
  // смотровая площадка у основания — «воронье гнездо» на лесах
  platform(x-2.6, z-1.2, x-0.6, z+1.2, 3.1, {posts:true});
  guardRail(x-2.6, z-1.2, x-2.6, z+1.2, 3.1);
  guardRail(x-2.6, z+1.2, x-0.6, z+1.2, 3.1);
  guardRail(x-2.6, z-1.2, x-0.6, z-1.2, 3.1);
  ladder(x-1.6, 0, z+1.5, 0, 3.1);
}

/* ---------- 2. Гараж с рампой на 2 этаж (СВ угол) ---------- */
function garage(cx, cz){
  const W = 15.0, D = 12.0;                 // габарит бокса
  const x0 = cx-W/2, x1 = cx+W/2, z0 = cz-D/2, z1 = cz+D/2;
  const Y2 = 3.9;                            // отметка настила стоянки
  const RW = 4.2;                            // ширина рампы

  /* --- каркас бокса: колонны и балки --- */
  for(const px of [x0, cx, x1]) for(const pz of [z0, z1]){
    addBox('steel', px, Y2*0.5, pz, 0.26, Y2, 0.26, {d:1.1});
    addBox('dark', px, 0.1, pz, 0.5, 0.2, 0.5, {d:1.2});
  }
  for(const pz of [z0, z1]) addBox('steel', cx, Y2+0.18, pz, W, 0.36, 0.22, {d:1.2});
  for(const px of [x0, cx, x1]) addBox('steel', px, Y2+0.18, cz, 0.22, 0.36, D, {d:1.2});

  /* --- стены бокса из профлиста, ворота открыты --- */
  // задняя (север) и боковая (восток) стены — глухие
  addBox('corr', cx, Y2*0.5+0.9, z0-0.05, W, Y2+1.8, 0.1, {d:.45});
  addBox('corr', x1+0.05, Y2*0.5+0.9, cz, 0.1, Y2+1.8, D, {d:.45});
  // западная стена с проёмом ворот
  for(const [pz, sz] of [[z0+D*0.18, D*0.36],[z1-D*0.14, D*0.28]])
    addBox('corr', x0-0.05, Y2*0.5+0.9, pz, 0.1, Y2+1.8, sz, {d:.45});
  // южная стена: широкий въезд
  addBox('corr', x0+W*0.14, Y2*0.5+0.9, z1+0.05, W*0.28, Y2+1.8, 0.1, {d:.45});

  /* --- настил стоянки 2 уровня с вырезом под рампу --- */
  const rampZ0 = z1-RW-0.6, rampZ1 = z1-0.6;
  const deckX0 = x0+0.2, deckX1 = x1-0.2;
  // полосы настила слева и справа от въезда рампы
  const slab = (a,b,c,d)=>{
    if(b-a < 0.2 || d-c < 0.2) return;
    addBox('steel', (a+b)/2, Y2-0.08, (c+d)/2, b-a, 0.16, d-c, {d:.7});
    // балки под настилом
    const n = Math.max(2, Math.round((b-a)/1.6));
    for(let i=0;i<=n;i++)
      addBox('steel', a+i*(b-a)/n, Y2-0.32, (c+d)/2, 0.12, 0.34, d-c, {collide:false, d:1.1});
  };
  slab(deckX0, deckX1, z0+0.2, rampZ0);
  slab(deckX0, cx-RW/2-0.6, rampZ0, rampZ1);
  slab(cx+RW/2+0.6, deckX1, rampZ0, rampZ1);
  slab(deckX0, deckX1, rampZ1, z1-0.2);

  /* --- рампа: наклонный въезд с бортами и поперечными рёбрами --- */
  const rampLen = 13.0;
  const rz1 = z1-0.6, rz0 = rz1 + rampLen;            // рампа уходит на юг
  const steps = 26;
  for(let i=0;i<steps;i++){
    const t0 = i/steps, t1 = (i+1)/steps;
    const za = rz0 + (rz1-rz0)*t0, zb = rz0 + (rz1-rz0)*t1;
    const ya = Y2*t0*t0*(3-2*t0), yb = Y2*t1*t1*(3-2*t1);   // плавный S-профиль
    const len = Math.hypot(zb-za, yb-ya);
    const g = new THREE.BoxGeometry(RW, 0.18, len);
    uvBox(g, RW, 0.18, len, .7);
    _e.set(Math.atan2(yb-ya, zb-za)*-1, 0, 0); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3(cx, (ya+yb)/2, (za+zb)/2), _q, new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket('steel').push(g);
    COLLIDERS.push({x0:cx-RW/2, y0:Math.min(ya,yb)-0.2, z0:Math.min(za,zb),
                    x1:cx+RW/2, y1:Math.max(ya,yb)+0.02, z1:Math.max(za,zb)});
    // поперечное рифление против пробуксовки
    if(i%2===0){
      const rg = new THREE.BoxGeometry(RW*0.96, 0.03, 0.09);
      rg.translate(cx, (ya+yb)/2+0.10, (za+zb)/2);
      bucket('steel').push(rg);
    }
  }
  // борта рампы и опоры
  for(const s of [-1,1]){
    const px = cx + s*(RW/2+0.1);
    for(let i=0;i<steps;i+=2){
      const t = i/steps, y = Y2*t*t*(3-2*t);
      const zz = rz0 + (rz1-rz0)*t;
      addBox('panel', px, y+0.34, zz, 0.2, 0.62, (rz1-rz0)/steps*2.05, {collide:false, d:.5});
      COLLIDERS.push({x0:px-0.12,y0:y,z0:zz-0.5,x1:px+0.12,y1:y+0.7,z1:zz+0.5});
    }
    for(const t of [0.32, 0.62, 0.88]){
      const y = Y2*t*t*(3-2*t), zz = rz0 + (rz1-rz0)*t;
      addBox('steel', px, y/2, zz, 0.14, y, 0.14, {d:1.1});
    }
  }
  // сигнальная разметка по краю рампы
  for(const s of [-1,1])
    addBox('hazard', cx+s*(RW/2-0.12), 0.02, rz0-0.4, 0.22, 0.04, 1.2, {collide:false, d:1});

  /* --- ограждение стоянки по открытым краям --- */
  guardRail(deckX0, z0+0.2, deckX0, rampZ0, Y2, 1.1);
  guardRail(deckX1, z0+0.2, deckX1, z1-0.2, Y2, 1.1);
  guardRail(deckX0, z0+0.2, deckX1, z0+0.2, Y2, 1.1);
  guardRail(deckX0, rampZ1, deckX0, z1-0.2, Y2, 1.1);
  guardRail(cx-RW/2-0.6, rampZ0, cx-RW/2-0.6, rampZ1, Y2, 1.1);
  guardRail(cx+RW/2+0.6, rampZ0, cx+RW/2+0.6, rampZ1, Y2, 1.1);

  /* --- разметка мест на обоих уровнях --- */
  for(const [py, pz] of [[0.014, cz-2.0], [Y2+0.03, cz-2.0]]){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(16,16), M.parkLine);
    m.rotation.x = -Math.PI/2; m.position.set(cx-1.0, py, pz);
    m.renderOrder = 1; scene.add(m);
  }

  /* --- машины: первый этаж --- */
  car(cx-4.6, 0, cz-3.2,  Math.PI/2, M.carRed,  {turn:0.22});
  car(cx-1.4, 0, cz-3.2,  Math.PI/2, M.carBlue);
  van(cx+3.2, 0, cz-2.8,  Math.PI/2, M.carWhite);
  pickup(cx-3.0, 0, cz+3.6, -Math.PI/2, M.carSand);
  carWreck(cx+5.4, 0, cz+3.4, Math.PI/2+0.12);
  /* --- машины: стоянка на 2 уровне --- */
  car(cx-4.4, Y2, cz-3.4, Math.PI/2, M.carGreen);
  car(cx-1.2, Y2, cz-3.4, Math.PI/2, M.carBlack, {turn:-0.18});
  pickup(cx+3.4, Y2, cz-3.0, Math.PI/2, M.carWhite);
  car(cx+2.0, Y2, cz+3.2, -Math.PI/2+0.08, M.carRed);

  /* --- гаражный инвентарь --- */
  workbench(x0+1.4, 0, z0+1.2, 0);
  workbench(cx-6.0, Y2, cz-5.0, 0);
  for(const [tx,tz] of [[x1-1.2, z0+1.4],[x1-1.2, z0+2.3],[x1-1.7, z0+1.9]]) tire(tx,0,tz);
  tire(cx+6.0, Y2, cz+4.4); tire(cx+6.0, Y2, cz+5.0);
  barrel(x0+1.0, 0, cz+1.0, 'green'); barrel(x0+1.7, 0, cz+1.6);
  barrel(cx-6.2, Y2, cz+4.0, 'blue');
  jerseyBarrier(cx, 0, rz0+0.6, Math.PI/2);
  cone(cx-2.4, 0, rz0-1.0); cone(cx+2.4, 0, rz0-1.2);
  cone(cx-1.8, Y2, rz1-0.8);
  // домкрат и стойка с колёсами у «донора»
  spool(x1-1.6, 0, z1-1.8);
  // подвесная лампа над ремзоной
  const lampY = Y2 - 0.5;
  addBox('dark', cx+5.2, lampY, cz+3.4, 1.2, 0.1, 0.24, {collide:false, d:1.4});
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1.1,8),
    new THREE.MeshBasicMaterial({color:0xf6f3e8}));
  tube.rotation.z = Math.PI/2; tube.position.set(cx+5.2, lampY-0.08, cz+3.4);
  scene.add(tube);
  LAMPS.push({pos:new THREE.Vector3(cx+5.2, lampY-0.3, cz+3.4), mesh:tube, on:1});

  return {x0,x1,z0,z1, deckY:Y2, rampZ0:rz0, rampZ1:rz1, rampX:cx, rampW:RW};
}

/* ---------- 3. Вертолётная площадка (ЮЗ угол) ---------- */
function helipad(cx, cz){
  const R = 7.2;
  // подиум площадки: бетонная плита чуть выше пола
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.26, 48), M.helipad);
  pad.position.set(cx, 0.13, cz);
  pad.receiveShadow = true; pad.castShadow = true;
  scene.add(pad); SHOOTABLE.push(pad);
  COLLIDERS.push({x0:cx-R,y0:0,z0:cz-R,x1:cx+R,y1:0.26,z1:cz+R});
  // фаска-отбортовка
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R, 0.14, 8, 48), M.dark);
  rim.rotation.x = Math.PI/2; rim.position.set(cx, 0.24, cz);
  rim.castShadow = true; scene.add(rim);

  /* --- периметр: сетчатое ограждение на стойках, с проходами --- */
  const fenceR = R + 1.9, posts = 28;
  const gates = [0.0, Math.PI];              // два прохода
  for(let i=0;i<posts;i++){
    const a = i/posts*Math.PI*2;
    if(gates.some(g=>Math.abs(((a-g+Math.PI*3)%(Math.PI*2))-Math.PI) > Math.PI-0.30)) continue;
    const px = cx+Math.cos(a)*fenceR, pz = cz+Math.sin(a)*fenceR;
    addBox('steel', px, 0.62, pz, 0.09, 1.24, 0.09, {collide:false, d:1.1});
    // сегмент сетки между стойками
    const a2 = (i+1)/posts*Math.PI*2;
    if(gates.some(g=>Math.abs(((a2-g+Math.PI*3)%(Math.PI*2))-Math.PI) > Math.PI-0.30)) continue;
    const qx = cx+Math.cos(a2)*fenceR, qz = cz+Math.sin(a2)*fenceR;
    const len = Math.hypot(qx-px, qz-pz);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(len, 1.15),
      new THREE.MeshStandardMaterial({color:0x6d7377, roughness:.86, metalness:.4,
        transparent:true, opacity:.34, side:THREE.DoubleSide}));
    mesh.position.set((px+qx)/2, 0.66, (pz+qz)/2);
    mesh.rotation.y = -Math.atan2(qz-pz, qx-px);
    scene.add(mesh);
    // верхняя и нижняя нитки
    for(const yy of [0.12, 1.20]){
      const g = new THREE.BoxGeometry(len, 0.045, 0.045);
      g.rotateY(-Math.atan2(qz-pz, qx-px));
      g.translate((px+qx)/2, yy, (pz+qz)/2);
      bucket('steel').push(g);
    }
    COLLIDERS.push({x0:Math.min(px,qx)-0.08, y0:0, z0:Math.min(pz,qz)-0.08,
                    x1:Math.max(px,qx)+0.08, y1:1.28, z1:Math.max(pz,qz)+0.08});
  }
  /* --- посадочные огни по кругу --- */
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    const px = cx+Math.cos(a)*(R-0.5), pz = cz+Math.sin(a)*(R-0.5);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.13,0.14,10), M.dark);
    base.position.set(px, 0.32, pz); base.castShadow = true; scene.add(base);
    const lens = new THREE.Mesh(new THREE.SphereGeometry(0.075,10,8),
      i%3===0 ? M.lightRed : M.lightAmb);
    lens.position.set(px, 0.44, pz); scene.add(lens);
  }
  /* --- ветроуказатель --- */
  const wsX = cx - fenceR - 0.9, wsZ = cz + fenceR*0.55;
  addBox('steel', wsX, 2.4, wsZ, 0.12, 4.8, 0.12, {d:1.1});
  addBox('dark', wsX, 0.12, wsZ, 0.6, 0.24, 0.6, {d:1.2});
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34,0.03,6,16), M.steel);
  ring.position.set(wsX+0.36, 4.7, wsZ); ring.rotation.y = Math.PI/2;
  scene.add(ring);
  // конус: чередование полос, слегка отклонён
  for(let i=0;i<5;i++){
    const r0 = 0.33 - i*0.045, r1 = 0.33 - (i+1)*0.045;
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, 0.42, 12, 1, true),
      i%2 ? new THREE.MeshStandardMaterial({color:0xb4b0a4, roughness:.92, side:THREE.DoubleSide})
          : new THREE.MeshStandardMaterial({color:0x9c4a28, roughness:.92, side:THREE.DoubleSide}));
    seg.rotation.z = -Math.PI/2 + 0.16;
    seg.position.set(wsX+0.55+i*0.41, 4.70 - i*0.07, wsZ);
    seg.castShadow = true; scene.add(seg);
  }
  /* --- сам вертолёт, слегка развёрнут относительно оси H --- */
  helicopter(cx+0.4, 0.26, cz-0.3, -0.42);
  /* --- наземное обслуживание --- */
  // тележка-буксировщик
  const cart = new THREE.Group();
  const cbody = new THREE.Mesh(roundedBox(1.5,0.42,0.9,0.1,3), M.paintY);
  cbody.position.y = 0.42; cart.add(cbody);
  const chandle = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1.1,8), M.steel);
  chandle.rotation.z = 0.9; chandle.position.set(1.05,0.6,0); cart.add(chandle);
  for(const sx of [-0.5,0.5]) for(const sz of [-1,1]){
    const w = new THREE.Mesh(new THREE.TorusGeometry(0.17,0.055,7,12), M.rubber);
    w.position.set(sx,0.17,sz*0.42); w.rotation.y=Math.PI/2; cart.add(w);
  }
  cart.position.set(cx-4.6, 0.26, cz+3.6); cart.rotation.y = 0.5;
  cart.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
  scene.add(cart); SHOOTABLE.push(cart);
  addAABB(cx-4.6, 0.26+0.35, cz+3.6, 1.8, 0.7, 1.1, 0.5);
  // топливные бочки под навесом и огнетушители
  barrel(cx-5.4, 0.26, cz-3.2, 'green'); barrel(cx-4.7, 0.26, cz-3.8, 'green');
  barrel(cx-5.6, 0.26, cz-4.2, null, true);
  extinguisher(cx+4.8, 0.26, cz+4.2, 0);
  extinguisher(cx+5.2, 0.26, cz+4.2, 0);
  cone(cx+3.6, 0.26, cz+5.0); cone(cx-3.2, 0.26, cz+5.2);
  // мачта прожекторов над площадкой
  const mx = cx + fenceR*0.72, mz = cz - fenceR*0.72;
  addBox('steel', mx, 3.3, mz, 0.16, 6.6, 0.16, {d:1.1});
  addBox('dark', mx, 0.14, mz, 0.7, 0.28, 0.7, {d:1.2});
  for(const a of [0.6, 1.2]){
    const head = new THREE.Mesh(roundedBox(0.44,0.3,0.2,0.05,2), M.dark);
    head.position.set(mx - Math.cos(a)*0.4, 6.5, mz + Math.sin(a)*0.4);
    head.rotation.y = a; head.castShadow = true; scene.add(head);
    const lens = new THREE.Mesh(new THREE.PlaneGeometry(0.36,0.24),
      new THREE.MeshBasicMaterial({color:0xdad6c4}));
    lens.position.set(mx - Math.cos(a)*0.52, 6.45, mz + Math.sin(a)*0.52);
    lens.rotation.y = a - Math.PI/2; lens.rotation.x = -0.3; scene.add(lens);
  }
  return {cx, cz, R, fenceR};
}

/* ---------- 4. Водонапорная башня и склад ГСМ (ЮВ угол) ---------- */
function waterTower(cx, cz){
  const legH = 6.4, tankR = 2.5, tankH = 3.4;
  const legR = 2.4;
  // четыре опоры со связями
  for(let i=0;i<4;i++){
    const a = i*Math.PI/2 + Math.PI/4;
    const px = cx+Math.cos(a)*legR, pz = cz+Math.sin(a)*legR;
    // опора с наклоном внутрь — башня сужается кверху
    const top = new THREE.Vector3(cx+Math.cos(a)*tankR*0.72, legH, cz+Math.sin(a)*tankR*0.72);
    const bot = new THREE.Vector3(px, 0, pz);
    const len = top.distanceTo(bot);
    const g = new THREE.CylinderGeometry(0.11,0.14,len,10);
    const m = new THREE.Mesh(g, M.steel);
    m.position.copy(bot).lerp(top,0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), top.clone().sub(bot).normalize());
    m.castShadow = true; scene.add(m); SHOOTABLE.push(m);
    COLLIDERS.push({x0:Math.min(px,top.x)-0.16,y0:0,z0:Math.min(pz,top.z)-0.16,
                    x1:Math.max(px,top.x)+0.16,y1:legH,z1:Math.max(pz,top.z)+0.16});
    addBox('dark', px, 0.12, pz, 0.6, 0.24, 0.6, {d:1.2});
  }
  // горизонтальные и крестовые связи
  for(const yy of [2.1, 4.3]){
    const k = 1 - yy/legH*(1 - tankR*0.72/legR);
    const rr = legR*k;
    for(let i=0;i<4;i++){
      const a0 = i*Math.PI/2+Math.PI/4, a1 = (i+1)*Math.PI/2+Math.PI/4;
      const p0 = new THREE.Vector3(cx+Math.cos(a0)*rr, yy, cz+Math.sin(a0)*rr);
      const p1 = new THREE.Vector3(cx+Math.cos(a1)*rr, yy, cz+Math.sin(a1)*rr);
      const len = p0.distanceTo(p1);
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,len,7), M.steel);
      b.position.copy(p0).lerp(p1,0.5);
      b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), p1.clone().sub(p0).normalize());
      b.castShadow = true; scene.add(b);
      // раскос по грани
      const q0 = new THREE.Vector3(p0.x, yy-2.1, p0.z), q1 = p1.clone();
      const dl = q0.distanceTo(q1);
      const d = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,dl,6), M.steel);
      d.position.copy(q0).lerp(q1,0.5);
      d.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), q1.clone().sub(q0).normalize());
      d.castShadow = true; scene.add(d);
    }
  }
  // бак с коническим дном и крышей
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(tankR,tankR,tankH,26), M.corr);
  tank.position.set(cx, legH+tankH/2, cz); tank.castShadow = tank.receiveShadow = true;
  scene.add(tank); SHOOTABLE.push(tank);
  const cone1 = new THREE.Mesh(new THREE.ConeGeometry(tankR, 1.5, 26), M.corr);
  cone1.position.set(cx, legH-0.7, cz); cone1.rotation.x = Math.PI; cone1.castShadow = true;
  scene.add(cone1);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(tankR+0.16, 1.0, 26), M.roof);
  roof.position.set(cx, legH+tankH+0.48, cz); roof.castShadow = true; scene.add(roof);
  COLLIDERS.push({x0:cx-tankR,y0:legH-1.4,z0:cz-tankR,x1:cx+tankR,y1:legH+tankH+0.9,z1:cz+tankR});
  // обручи жёсткости и лестница с ограждением
  for(const t of [0.22, 0.5, 0.78]){
    const h = new THREE.Mesh(new THREE.TorusGeometry(tankR+0.05, 0.05, 6, 26), M.steel);
    h.rotation.x = Math.PI/2; h.position.set(cx, legH+tankH*t, cz); scene.add(h);
  }
  for(let i=0;i<Math.floor((legH+tankH)/0.32);i++){
    addBox('steel', cx+tankR+0.26, 0.3+i*0.32, cz, 0.42, 0.04, 0.04, {collide:false, d:1});
  }
  for(const s of [-0.2,0.2]){
    addBox('steel', cx+tankR+0.26, (legH+tankH)/2, cz+s, 0.05, legH+tankH, 0.05, {collide:false, d:1});
  }
  // площадка обслуживания вокруг бака
  const walkR = tankR+0.75;
  for(let i=0;i<24;i++){
    const a0=i/24*Math.PI*2, a1=(i+1)/24*Math.PI*2;
    const px=(Math.cos(a0)+Math.cos(a1))/2*walkR*0.94, pz=(Math.sin(a0)+Math.sin(a1))/2*walkR*0.94;
    const g = new THREE.BoxGeometry(0.72, 0.06, 0.78);
    g.rotateY(-a0); g.translate(cx+px, legH+tankH*0.08, cz+pz);
    bucket('steel').push(g);
    const r = new THREE.BoxGeometry(0.05, 1.0, 0.05);
    r.translate(cx+Math.cos(a0)*walkR, legH+tankH*0.08+0.5, cz+Math.sin(a0)*walkR);
    bucket('steel').push(r);
  }
  COLLIDERS.push({x0:cx-walkR,y0:legH+tankH*0.05,z0:cz-walkR,
                  x1:cx+walkR,y1:legH+tankH*0.08+0.08,z1:cz+walkR});
  // труба вниз и вентиль
  const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,legH-0.6,12), M.steel);
  pipe.position.set(cx-tankR*0.5, (legH-0.6)/2, cz+tankR*0.5); pipe.castShadow=true; scene.add(pipe);
  const valve = new THREE.Mesh(new THREE.TorusGeometry(0.3,0.045,6,14), M.heliTrim);
  valve.position.set(cx-tankR*0.5, 1.3, cz+tankR*0.5+0.2); valve.castShadow=true; scene.add(valve);

  /* --- под башней: склад ГСМ с обваловкой --- */
  const bx = cx - 6.0, bz = cz + 1.0;
  for(const [ax,az,sx,sz] of [[bx,bz-2.6,6.4,0.35],[bx,bz+2.6,6.4,0.35],
                              [bx-3.0,bz,0.35,5.5],[bx+3.0,bz,0.35,5.5]])
    addBox('panel', ax, 0.33, az, sx, 0.66, sz, {d:.45});
  for(let i=0;i<4;i++) for(let j=0;j<2;j++)
    barrel(bx-2.0+i*1.3, 0, bz-1.0+j*1.9, j?'green':null);
  barrel(bx+2.2, 0, bz+1.6, null, true);
  // навес над складом
  for(const sx of [-1,1]) for(const sz of [-1,1])
    addBox('steel', bx+sx*2.8, 1.5, bz+sz*2.3, 0.12, 3.0, 0.12, {d:1.1});
  const canopy = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 5.4), M.roof);
  canopy.rotation.x = -Math.PI/2 + 0.09; canopy.position.set(bx, 3.1, bz);
  canopy.castShadow = true; canopy.receiveShadow = true; scene.add(canopy);
  SHOOTABLE.push(canopy);
  COLLIDERS.push({x0:bx-3.3,y0:3.0,z0:bz-2.7,x1:bx+3.3,y1:3.2,z1:bz+2.7});
  // знаки и разметка опасной зоны
  for(const s of [-1,1])
    addBox('hazard', bx+s*3.2, 0.7, bz, 0.08, 0.5, 0.7, {collide:false, d:1});
  return {cx, cz};
}

/* ---------- 5. Центр: контейнерная башня и кран-балка ---------- */
function containerStack(cx, cz){
  // Морские контейнеры ставим пирамидой: лазалка и укрытие в центре карты.
  const CW = 2.44, CH = 2.59;
  // Выгоревшая на солнце эмаль: светлее «каталожных» цветов, иначе в тени
  // контейнеры сливаются в чёрные кубы.
  const cols = [0x9c6f55, 0x5f7f90, 0x7f8a6e, 0xa98452, 0x8a8d92];
  const put = (px,py,pz, len, rotY, col)=>{
    const mat = new THREE.MeshStandardMaterial({color:col, roughness:.84, metalness:.18,
      envMapIntensity:.6});
    const G = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(len, CH, CW), mat);
    G.add(body);
    // гофрированные борта
    const n = Math.round(len/0.28);
    for(let i=0;i<n;i++) for(const s of [-1,1]){
      const rib = new THREE.Mesh(new THREE.BoxGeometry(0.1, CH*0.9, 0.05), mat);
      rib.position.set(-len/2+0.16+i*0.28, 0, s*(CW/2+0.02)); G.add(rib);
    }
    for(const s of [-1,1]){        // торцы: рама + створки
      const fr = new THREE.Mesh(new THREE.BoxGeometry(0.06, CH, CW), M.darker);
      fr.position.set(s*len/2, 0, 0); G.add(fr);
      for(const d of [-1,1]){
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.04, CH*0.92, CW*0.46), mat);
        leaf.position.set(s*(len/2+0.04), 0, d*CW*0.24); G.add(leaf);
        for(const ry of [-0.5,0.5]){
          const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,CH*0.88,8), M.darker);
          rod.position.set(s*(len/2+0.07), 0, d*CW*0.24 + ry*0.28); G.add(rod);
        }
      }
    }
    for(const sx of [-1,1]) for(const sz of [-1,1]) for(const sy of [-1,1]){
      const cn = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.18,0.2), M.darker);
      cn.position.set(sx*(len/2-0.1), sy*(CH/2-0.09), sz*(CW/2-0.1)); G.add(cn);
    }
    G.position.set(px, py+CH/2, pz); G.rotation.y = rotY;
    G.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
    scene.add(G); SHOOTABLE.push(G);
    addAABB(px, py+CH/2, pz, len, CH, CW, rotY);
  };
  // нижний ярус: три контейнера в ряд, верхний — два поперёк
  put(cx-3.3, 0, cz-2.8, 6.06, 0, cols[0]);
  put(cx-3.3, 0, cz+0.0, 6.06, 0, cols[1]);
  put(cx+2.4, 0, cz-1.4, 6.06, 0, cols[2]);
  put(cx-2.0, CH, cz-1.4, 6.06, Math.PI/2, cols[3]);
  put(cx+2.0, CH, cz+1.6, 6.06, Math.PI/2, cols[4]);
  put(cx-0.4, CH*2, cz+0.2, 6.06, 0.35, cols[1]);

  // сходни и лестница на верхний ярус
  ladder(cx-6.5, 0, cz-1.4, Math.PI/2, CH+0.4);
  ladder(cx-2.2, CH, cz+2.9, 0, CH+0.4);
  // мостик между ярусами
  addBox('steel', cx+0.4, CH*2-0.06, cz-2.6, 3.2, 0.12, 1.2, {d:.7});
  guardRail(cx-1.2, cz-3.2, cx+2.0, cz-3.2, CH*2, 1.0);

  /* --- кран-балка над штабелем: главный вертикальный ориентир --- */
  // Балка выше верхнего контейнера (3 яруса ≈ 7.8 м), но ниже карниза.
  const beamY = 8.8, span = 13.0;
  for(const s of [-1,1]){
    const px = cx + s*span/2;
    addBox('steel', px, beamY/2, cz-3.4, 0.34, beamY, 0.34, {d:1.1});
    addBox('steel', px, beamY/2, cz+3.4, 0.34, beamY, 0.34, {d:1.1});
    addBox('dark', px, 0.14, cz-3.4, 0.8, 0.28, 0.8, {d:1.2});
    addBox('dark', px, 0.14, cz+3.4, 0.8, 0.28, 0.8, {d:1.2});
    // связи портала
    addBox('steel', px, beamY-0.4, cz, 0.22, 0.3, 7.2, {collide:false, d:1.2});
    const dl = Math.hypot(6.8, beamY*0.5);
    const g = new THREE.BoxGeometry(0.14, dl, 0.14);
    g.rotateX(Math.atan2(6.8, beamY*0.5));
    g.translate(px, beamY*0.7, cz);
    bucket('steel').push(g);
  }
  // главная балка с ездовой тележкой
  addBox('steel', cx, beamY, cz, span, 0.62, 0.42, {collide:false, d:1.3});
  addBox('steel', cx, beamY-0.36, cz, span, 0.14, 0.7, {collide:false, d:1.3});
  for(let i=0;i<14;i++){         // решётка балки
    const px = cx - span/2 + (i+0.5)*span/14;
    const g = new THREE.BoxGeometry(0.1, 0.62, 0.1);
    g.rotateZ(i%2?0.7:-0.7); g.translate(px, beamY-0.18, cz+0.2);
    bucket('steel').push(g);
  }
  const trolley = new THREE.Mesh(roundedBox(1.3,0.6,0.9,0.08,3), M.paintY);
  trolley.position.set(cx+2.6, beamY-0.72, cz); trolley.castShadow = true;
  scene.add(trolley); SHOOTABLE.push(trolley);
  // трос и крюк
  const hookY = CH*2 + 1.1;                    // крюк висит рядом со штабелем
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022, beamY-1.0-hookY, 6), M.cable);
  rope.position.set(cx+2.6, (beamY-1.02+hookY)/2, cz); rope.castShadow = true; scene.add(rope);
  const block = new THREE.Mesh(roundedBox(0.34,0.44,0.22,0.06,2), M.steel);
  block.position.set(cx+2.6, hookY+0.2, cz); block.castShadow = true; scene.add(block);
  const hook = new THREE.Mesh(new THREE.TorusGeometry(0.16,0.045,6,12,Math.PI*1.4), M.steel);
  hook.position.set(cx+2.6, hookY-0.16, cz); hook.rotation.x = Math.PI/2;
  hook.castShadow = true; scene.add(hook);
  return {cx, cz};
}

/** Анимация точек интереса. Флаг — единственный движущийся объект карты:
    техника статична, потому что служит укрытием. */
function animatePOI(t){
  for(const p of POI){
    if(p.kind !== 'flag') continue;
    const pos = p.geo.attributes.position, b = p.base;
    for(let i=0;i<pos.count;i++){
      const x = b[i*3], y = b[i*3+1];
      // u — доля от шкаторины: у мачты ткань закреплена, к свободному краю
      // амплитуда растёт квадратично.
      const u = clamp((x + p.w/2)/p.w, 0, 1);
      const amp = u*u;
      const wave = Math.sin(u*7.0 - t*3.1) * 0.17 + Math.sin(u*3.1 - t*1.9 + y*1.4) * 0.11;
      pos.setZ(i, wave*amp*p.h*0.55);
      // полотнище слегка провисает и подбирается к древку
      pos.setX(i, x - amp*0.10*p.w*Math.abs(Math.sin(u*3.4 - t*2.2)));
      pos.setY(i, y + Math.sin(u*4.2 - t*2.6)*0.045*amp*p.h);
    }
    pos.needsUpdate = true;
    p.geo.computeVertexNormals();
  }
}

/* ============================================================================
   МОДУЛЬНЫЕ УКРЫТИЯ
   Бетонные блоки, бытовки и штабели: из них набираются линии укрытий
   в открытых пролётах между зданием и стенами ангара.
============================================================================ */
/** Бетонный блок-«лего» (FBS): типовое укрытие по пояс. */
function concBlock(x,y,z,rotY, len=1.6, h=0.62){
  y = snapSupport(x,z,y); if(y === null) return;
  addBox('panel', x, y+h/2, z, len, h, 0.6, {rotY, d:.5});
  // монтажные петли
  for(const s of [-1,1]){
    const o = s*len*0.28;
    const lp = new THREE.Mesh(new THREE.TorusGeometry(0.075,0.017,5,10,Math.PI), M.steel);
    lp.position.set(x+Math.cos(rotY)*o, y+h+0.02, z-Math.sin(rotY)*o);
    lp.rotation.y = rotY; lp.castShadow = true; scene.add(lp);
  }
}
/** Стенка из блоков в два-три ряда: главное линейное укрытие. */
function blockWall(x,z,rotY, len=6.0, rows=2){
  const n = Math.max(1, Math.round(len/1.6));
  for(let r=0;r<rows;r++){
    const off = r%2 ? 0.8 : 0;                   // перевязка швов
    for(let i=0;i<n;i++){
      const t = -len/2 + 0.8 + i*1.6 + off;
      if(Math.abs(t) > len/2) continue;
      if(r>0 && srnd()<0.22) continue;           // выбитые блоки верхнего ряда
      const px = x + Math.cos(rotY)*t, pz = z - Math.sin(rotY)*t;
      concBlock(px, r*0.62, pz, rotY + sr(-0.03,0.03), 1.55, 0.62);
    }
  }
}
/** Бытовка / блок-контейнер: дверь, окно, крыша с уклоном. */
function cabin(x,y,z,rotY, w=2.4, d=5.6, h=2.5, col=0x7b8076){
  y = snapSupport(x,z,y); if(y === null) return;
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:.8, metalness:.32});
  const G = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(d,h,w), mat);
  body.position.y = h/2 + 0.16; G.add(body);
  // гофра борта
  for(let i=0;i<Math.round(d/0.4);i++) for(const s of [-1,1]){
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.06,h*0.9,0.04), mat);
    rib.position.set(-d/2+0.2+i*0.4, h/2+0.16, s*(w/2+0.02)); G.add(rib);
  }
  // крыша с небольшим свесом
  const roof = new THREE.Mesh(new THREE.BoxGeometry(d+0.2, 0.1, w+0.2), M.roof);
  roof.position.y = h+0.2; G.add(roof);
  // дверь и окно
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.0, 0.85), M.darker);
  door.position.set(d/2+0.01, 1.16, -w*0.2); G.add(door);
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.2), M.chrome);
  hand.position.set(d/2+0.06, 1.1, -w*0.2+0.3); G.add(hand);
  for(const px of [-d*0.3, d*0.14]){
    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.8), M.glass);
    win.position.set(px, 1.72, w/2+0.03); win.rotation.y = 0; G.add(win);
    const fr = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.9,0.05), M.darker);
    fr.position.set(px, 1.72, w/2+0.01); G.add(fr);
    // решётка на окне
    for(let i=0;i<4;i++){
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.03,0.82,0.03), M.steel);
      b.position.set(px-0.4+i*0.27, 1.72, w/2+0.06); G.add(b);
    }
  }
  // опорные брусья и ступень
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const blk = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.16,0.5), M.panel);
    blk.position.set(sx*(d/2-0.5), 0.08, sz*(w/2-0.4)); G.add(blk);
  }
  const step = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.16,1.0), M.steel);
  step.position.set(d/2+0.32, 0.4, -w*0.2); G.add(step);
  G.position.set(x,y,z); G.rotation.y = rotY;
  G.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
  scene.add(G); SHOOTABLE.push(G);
  addAABB(x, y+(h+0.26)/2, z, d, h+0.26, w, rotY);
}
/** Бетонная труба: круглое укрытие, сквозь которое можно пролезть. */
function pipeStack(x,y,z,rotY,n=3){
  y = snapSupport(x,z,y); if(y === null) return;
  const R = 0.72, L = 2.4;
  const lay = [[0,0],[1,0],[2,0],[0.5,1],[1.5,1],[1,2]];
  for(let i=0;i<Math.min(n*2,lay.length);i++){
    const [c,r] = lay[i];
    const ox = (c-1)*R*2.05, oy = R + r*R*1.78;
    const px = x - Math.sin(rotY)*ox, pz = z - Math.cos(rotY)*ox;
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(R,R,L,20,1,true), M.panel);
    tube.rotation.z = Math.PI/2; tube.rotation.y = rotY;
    tube.position.set(px, y+oy, pz); tube.castShadow = tube.receiveShadow = true;
    scene.add(tube); SHOOTABLE.push(tube);
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(R*0.82,R*0.82,L*0.99,20,1,true),
      new THREE.MeshStandardMaterial({color:0x6d6a63, roughness:.96, side:THREE.BackSide}));
    inner.rotation.z = Math.PI/2; inner.rotation.y = rotY; inner.position.copy(tube.position);
    scene.add(inner);
    // раструбы по торцам
    for(const s of [-1,1]){
      const rim = new THREE.Mesh(new THREE.TorusGeometry(R*0.91, R*0.09, 6, 20), M.panel);
      rim.position.set(px + Math.cos(rotY)*s*L/2, y+oy, pz - Math.sin(rotY)*s*L/2);
      rim.rotation.y = rotY + Math.PI/2; scene.add(rim);
    }
    // стенки трубы твёрдые, а просвет — проходной
    for(const so of [-1,1])
      COLLIDERS.push({x0:px-(rotY?0.2:L/2)-0.2, y0:y+oy+so*R*0.86-0.16,
                      z0:pz-(rotY?L/2:0.2)-0.2, x1:px+(rotY?0.2:L/2)+0.2,
                      y1:y+oy+so*R*0.86+0.16, z1:pz+(rotY?L/2:0.2)+0.2});
  }
}
/** Катушка кабеля и ящик с песком — мелкие модули для заполнения. */
function sandBox(x,y,z,rotY){
  y = snapSupport(x,z,y); if(y === null) return;
  addBox('wood', x, y+0.3, z, 1.5, 0.6, 0.9, {rotY, d:1.0});
  const sand = new THREE.Mesh(new THREE.BoxGeometry(1.36,0.14,0.78), M.dirt);
  sand.position.set(x, y+0.62, z); sand.rotation.y = rotY;
  sand.castShadow = sand.receiveShadow = true; scene.add(sand);
  const shovel = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.04,1.1), M.wood);
  shovel.position.set(x+0.4, y+0.68, z); shovel.rotation.y = rotY+0.4;
  shovel.castShadow = true; scene.add(shovel);
}

  pipeStack(10.0, 0, 22.0, Math.PI/2, 3);
